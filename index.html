<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Repo Library</title>
<style>
:root{--bg:#0a0c10;--panel:#13161d;--border:#292e39;--text:#f4f7fb;--muted:#9da8b8;--accent:#d8ff61}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0,#29204a55,transparent 32rem),var(--bg);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:1180px;margin:auto;padding:52px 22px 80px}.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:28px}.eyebrow{font-size:11px;letter-spacing:.16em;color:var(--accent);font-weight:800}h1{font-size:clamp(42px,7vw,78px);line-height:.95;margin:9px 0 14px;letter-spacing:-.055em}.hero p{max-width:700px;color:var(--muted);line-height:1.6;margin:0}.tools{display:grid;grid-template-columns:1fr 220px;gap:12px;margin:20px 0}.tools input,.tools select{width:100%;background:#11151c;color:var(--text);border:1px solid var(--border);border-radius:11px;padding:12px}.stats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.pill{border:1px solid var(--border);border-radius:999px;padding:7px 10px;color:var(--muted);font-size:12px}.pill b{color:var(--text)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.card{background:linear-gradient(180deg,#ffffff0e,#ffffff07);border:1px solid var(--border);border-radius:18px;padding:20px}.top{display:flex;justify-content:space-between;gap:12px}.cat{font-size:12px;color:var(--muted)}h3{font-size:27px;margin:6px 0 0}.status{border:1px solid var(--border);border-radius:999px;padding:6px 9px;font-size:11px;height:max-content}.k{font-size:10px;letter-spacing:.12em;color:var(--muted);margin-top:18px;text-transform:uppercase}.card p{margin:6px 0 0;line-height:1.5;color:#dce3ec}.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:16px}.tag{font-size:11px;background:#ffffff0b;padding:6px 8px;border-radius:7px;color:#b7c0cc}.actions{display:flex;align-items:center;margin-top:18px}.actions a{color:var(--accent);text-decoration:none;font-weight:700}.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:50px}.error{border:1px solid #ff777755;background:#ff777711;border-radius:12px;padding:14px;color:#ffb2b2}@media(max-width:760px){.hero{flex-direction:column;align-items:flex-start}.tools,.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero"><div><div class="eyebrow">REPO ÖĞRENİMİ</div><h1>AI Repo Library</h1><p>İncelediğimiz AI ve agent repolarını tek yerde toplar. Her kayıt; ne işe yaradığını, durumunu ve güvenlik değerlendirmesini gösterir.</p></div></div>
  <div class="tools"><input id="q" placeholder="Repo, kategori veya etiket ara..."><select id="filter"><option value="">Tüm kategoriler</option></select></div>
  <div class="stats" id="stats"></div><div class="grid" id="grid"><div class="empty">Yükleniyor…</div></div>
</div>
<script>
const DATA_URL='https://raw.githubusercontent.com/Heermesss/repo-learning-library/main/data/repos.json';
let data=[];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(){const q=document.querySelector('#q').value.toLowerCase().trim(),f=document.querySelector('#filter').value;const cats=[...new Set(data.map(x=>x.category).filter(Boolean))].sort();const sel=document.querySelector('#filter'),old=sel.value;sel.innerHTML='<option value="">Tüm kategoriler</option>'+cats.map(c=>`<option>${esc(c)}</option>`).join('');sel.value=old;const rows=data.filter(r=>(!f||r.category===f)&&(!q||[r.name,r.category,r.purpose,r.status,r.security,...(r.tags||[])].join(' ').toLowerCase().includes(q)));document.querySelector('#stats').innerHTML=`<span class="pill"><b>${data.length}</b> toplam repo</span><span class="pill"><b>${data.filter(x=>x.status==='Kurulu').length}</b> kurulu</span><span class="pill"><b>${data.filter(x=>/audit gerekli/i.test(x.security||'')).length}</b> audit bekliyor</span>`;document.querySelector('#grid').innerHTML=rows.length?rows.map(r=>`<article class="card"><div class="top"><div><div class="cat">${esc(r.category)}</div><h3>${esc(r.name)}</h3></div><div class="status">${esc(r.status)}</div></div><div class="k">Ne yapıyor?</div><p>${esc(r.purpose||'—')}</p><div class="k">Güvenlik</div><p>${esc(r.security||'—')}</p><div class="tags">${(r.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div><div class="actions"><a href="${esc(r.url)}" target="_blank" rel="noreferrer">GitHub ↗</a></div></article>`).join(''):'<div class="empty">Eşleşen repo yok.</div>'}
async function load(){try{const res=await fetch(DATA_URL+'?t='+Date.now(),{cache:'no-store'});if(!res.ok)throw new Error('HTTP '+res.status);data=await res.json();render()}catch(e){document.querySelector('#grid').innerHTML=`<div class="error">Katalog yüklenemedi: ${esc(e.message)}</div>`}}
document.querySelector('#q').oninput=render;document.querySelector('#filter').onchange=render;load();
</script>
</body>
</html>
